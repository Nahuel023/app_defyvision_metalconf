threshold: 175
use_channel: r
polarity: bright
min_area: 80.0
circularity_min: 0.8
tol_xy_px: 22.0
aspect_ratio_max: 2.0
align_match_tol_px: 150.0
min_match_count: 6
consecutive_nok_frames: 9999
frame_rate_hz: 25.0
