threshold: 175
use_channel: r
polarity: bright
min_area: 80.0
circularity_min: 0.8
tol_xy_px: 22.0
aspect_ratio_max: 2.0
align_match_tol_px: 150.0
min_match_count: 6
consecutive_nok_frames: 9999  # CALIBRACIÓN — deshabilita FAULT temporalmente
frame_rate_hz: 5.0
max_response_sec: 1.6
edge_margin_px: 15.0
# Margen para build-pattern: más grande excluye agujeros de borde que desaparecen
# cuando la lámina se desplaza. Si no se define, usa edge_margin_px.
pattern_edge_margin_px: 40.0
use_clahe: true
clahe_clip: 3.0
clahe_tile: 8
use_otsu: true
# Umbral de diferencia media de píxeles entre el frame actual y el último
# inspeccionado para considerar que hay suficiente material nuevo y disparar
# una inspección. Más alto = menos inspecciones (secciones más separadas).
# Ajustar en planta según velocidad de avance y tamaño del patrón.
continuous_position_threshold: 8.0

# ── Overrides por modelo ──────────────────────────────────────────────────────
# Solo especificar los parámetros que difieren del global.
# Los no especificados heredan los valores de arriba.
# Ejemplo:
#   modelo_B:
#     min_area: 60.0          # agujeros más chicos
#     tol_xy_px: 18.0         # distribución más densa
#     consecutive_nok_frames: 6
models:
  modelo_A: {}               # usa todos los defaults globales

  modelo_B:
    # ── Detección ──────────────────────────────────────────────────────────
    # Producción: backlight encendido → agujeros brillantes → polarity bright.
    # IMPORTANTE: si se reconstruye el patrón con Fotos/1.jpeg (sin backlight),
    # cambiar temporalmente a polarity: dark, luego volver a bright.
    polarity: bright
    min_area: 300.0           # agujeros grandes (área mediana ~1100 px² en ref.)
    circularity_min: 0.75     # ligeramente más permisivo que global 0.8
    aspect_ratio_max: 2.0
    # ── Matching ───────────────────────────────────────────────────────────
    tol_xy_px: 28.0           # tolerancia mayor para variación de posición + aliasing de grilla
    align_match_tol_px: 120.0
    min_match_count: 5        # patrón puede estar parcialmente fuera de frame
    # ── Bordes ─────────────────────────────────────────────────────────────
    edge_margin_px: 25.0
    pattern_edge_margin_px: 80.0
    # Número máximo de agujeros faltantes permitidos antes de declarar NOK.
    # Absorbe variaciones menores de detección (iluminación, movimiento).
    # Un punzón roto elimina ~25 agujeros en un frame → sigue siendo NOK.
    grid_max_missing: 10
    # Frames consecutivos NOK para declarar FAULT. Max streak en material bueno
    # (blur de movimiento) = 45; punzón roto → racha sostenida >> 60.
    consecutive_nok_frames: 60
    # ── Modo continuo ──────────────────────────────────────────────────────
    # Grabaciones @ 10fps muestran diff máx 5.21px. Global=8.0 nunca dispara
    # para este material. Con 4.0 se obtienen ~100-140 inspecciones / 321 frames.
    continuous_position_threshold: 4.0
