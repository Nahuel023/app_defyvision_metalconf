    pattern_edge_boundary_tol_px: 8.0
    compare_top_ignore_px: 46.0
    compare_bottom_ignore_px: 42.0
    compare_left_ignore_px: 40.0    # excluye ci=0 (x≈16) y ci=1 (x≈18-36) del patron — borde izq no detectable
    compare_right_ignore_px: 30.0   # excluye un poco mas del borde der, donde este lote mantiene faltantes falsos residuales
    frame_missing_nok_threshold: 8
    tilt_warn_deg: 0.0
