    pattern_align_abs_max_px: 22.0   # normal ~2px; bordes de chapa: 13-18px; desalineados reales: >22px
    pattern_align_machine_stop: true # activar parada por racha
    pattern_align_stop_frames: 3     # frames consecutivos desalineados para parar la maquina
    pattern_global_offset_max_px: 10.0
    pattern_slope_delta_max_deg: 4.0  # frames de borde de chapa miden ~3.1 deg; desalineados reales > 4 deg
