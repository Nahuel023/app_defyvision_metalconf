use_otsu: true
continuous_position_threshold: 0.0
max_inspection_hz: 25
# ---------------- Buffer circular de frames OK ----------------
# Guarda las ultimas ok_buffer_count inspecciones correctas (con overlay verde)
# en data/output/ok_buffer/<scanner_id>/ sobreescribiendo las mas viejas.
# Util para ver como esta funcionando la deteccion sin errores.
ok_buffer_enabled: true
ok_buffer_count: 1500         # frames a mantener por scanner (~150 MB a 100 KB/frame)
ok_buffer_every: 1            # guardar todos los frames OK
ok_buffer_jpeg_quality: 75    # calidad JPEG
timeline_buffer_enabled: true
timeline_buffer_count: 500    # ultimos 500 frames cronologicos (OK+NOK+LQ+STOP) por scanner

events_enabled: true
events_max_disk_gb: 10.0
pre_event_seconds: 60.0
post_event_seconds: 30.0
pre_event_fps: 5.0
pre_event_jpeg_quality: 80
pre_event_max_ram_mb: 256.0
