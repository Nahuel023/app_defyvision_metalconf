# Mapa de señales PLC — Coolmay CX3G, Modbus TCP
# Entradas X → Discrete Inputs  (base 0x3400 + offset)
# Salidas  Y → Coils             (base 0x3300 + offset)

plc:
  ip: "192.168.10.175"
  port: 502
  unit_id: 1
  poll_interval_ms: 50

scanner_1:
  camera_source: "http://192.168.1.3/oneshotimage.jpg"
  model: "modelo_B"
  allowed_models: ["modelo_A", "modelo_B"]   # Esterilla y Microperforado
  force_auto_mode: true   # TEMPORAL: forzar AUTO mientras X0 no llega al PLC
  inspection_models:
    modelo_B:
      # Calibracion 21-07-2026 con zoom digital 150%: el microperforado ocupa una
      # grilla alternada de 5/6 agujeros por fila dentro de la ROI. Construir y
      # comparar todas las columnas completas, descartando solo filas parciales.
      pattern_edge_margin_px: 12.0
      pattern_edge_margin_left_px: 12.0
      pattern_edge_margin_right_px: 12.0
      pattern_edge_margin_top_px: 18.0
      pattern_edge_margin_bottom_px: 18.0
      # Rehabilitado para los frames editados con patron corrido: scanner_1 muestra
      # una deriva lateral clara de ~9-11px entre frame_0070 y frame_0074.
      pattern_align_enabled: true
      pattern_global_offset_max_px: 8.0
      pattern_slope_delta_max_deg: 1.0
      # scanner_1 exige como minimo 4 frames consecutivos para cualquier parada
      # (racha NOK / faltantes / desalineacion). Ver stop_min_frames abajo (piso duro).
      pattern_align_stop_frames: 4
      pattern_align_severe_abs_max_px: 0.0
      # Mismo gate que scanner_2: exige al menos 1 faltante para entrar al check de
      # zigzag/severo, filtrando frames de borde de chapa (std/zigzag alto pero
      # missing=0) que de otra forma podrian disparar la parada de 1 solo frame.
      pattern_align_min_missing: 1
      # Con paridad corregida, 12px absorbe la curvatura real medida (<=8px) sin
      # permitir que una columna vecina tape un agujero faltante.
      tol_xy_px: 12.0
      grid_allow_row_parity_flip: true
      grid_extend_rows_before: 3
      grid_extend_rows_after: 3
      grid_compare_margin_x_px: 12.0
      grid_compare_margin_y_px: 20.0
      compare_left_ignore_px: 12.0
      compare_right_ignore_px: 12.0
      compare_top_ignore_px: 20.0
      # La Sony incrusta fecha/hora sobre y~445..479 y tapa parcialmente la ultima
      # fila; esa zona no contiene evidencia visual confiable para una decision.
      compare_bottom_ignore_px: 36.0
      # El lote OK queda en cero faltantes; cualquier agujero ausente se marca NOK
      # y debe persistir por la regla temporal antes de detener produccion.
      grid_max_missing: 0
      # En scanner_1 el ruido normal deja faltantes sueltos repartidos, pero el defecto
      # editado arma una misma columna con 4-6 agujeros ausentes durante varios frames.
      # Usamos esa firma para machine_stop sin depender de que el frame entero ya haya
      # cruzado el gate global de NOK.
      machine_stop_min_missing: 4
      machine_stop_require_frame_nok: false
      machine_stop_missing_frames: 4   # scanner_1: faltantes persistentes exigen 4 frames
      # PISO DURO por scanner (solo scanner_1): ninguna parada — racha NOK (FAULT),
      # faltantes persistentes NI desalineacion — dispara antes de 4 frames consecutivos.
      # Enforced en codigo (no se puede bajar por config). scanner_2 NO lo define → sigue igual.
      stop_min_frames: 4
      # ROI recenter en modo MOVE (Cambio 235): a diferencia del modo resize (que
      # causaba el desync de Cambio 185/189 al ir agrandando w), move desplaza la
      # ventana en x sin tocar w, asi el frame post-ROI sigue calzando siempre con
      # image_size del patron.
      # No reacciona de golpe ante una desalineacion repentina: urgent_delta_px queda
      # tan alto que el atajo de 1-solo-frame nunca dispara (un salto brusco de todos
      # los frames es sintoma de un problema mecanico real, no algo que el ROI deba
      # "corregir" solo). El centrado absoluto actua unicamente si el desvio se
      # sostiene varios frames; ya no espera missing porque el objetivo es corregir
      # la ROI antes de que el recorte llegue a perder agujeros.
      roi_recenter_enabled: false   # FIJO: el ROI NO se auto-mueve ni se re-guarda; la posicion queda exactamente como se calibro (evita el corrimiento lateral al reiniciar)
      roi_recenter_mode: move
      # Sigue automaticamente cualquier deriva respecto de la relacion ROI/chapa
      # aprendida al arrancar; no intenta forzar el ROI al centro geometrico.
      roi_recenter_require_edge_missing: false
      # Cambio 246 (03-07-2026): en RUN vivo, antes de que actue la startup grace,
      # _run_roi_precalibration() podia mover la ROI usando frames de arranque
      # todavia inestables. Eso explica el sintoma "en carpeta/raw da OK pero al
      # darle RUN salta ERROR al instante". Se desactiva SOLO la pre-calibracion
      # agresiva al iniciar; el roi_recenter gradual durante la corrida sigue
      # activo y protegido por warmup/streak.
      roi_precal_enabled: false
      roi_recenter_warmup_frames: 20
      roi_recenter_trigger_delta_px: 3.0
      roi_recenter_edge_missing_min: 2
      roi_recenter_edge_band_px: 30.0
      roi_recenter_streak_frames: 8
      roi_recenter_step_px: 1.0
      roi_recenter_max_total_shift_px: 20.0
      roi_recenter_urgent_delta_px: 1000.0
      roi_recenter_cooldown_frames: 8
      roi_recenter_cooldown_max_frames: 8
      roi_recenter_cooldown_mult: 1.0
  inputs:
    mode_switch:  0   # X0  — maneta (0=MANUAL, 1=AUTO)
  outputs:
    light_red:    0   # Y0  — rojo:     FAULT / parada forzada
    light_green:  1   # Y1  — verde:    RUNNING sin advertencias
    light_yellow: 2   # Y2  — amarillo: racha NOK activa (advertencia)
    light_blue:   3   # Y3  — azul:     IDLE / listo para arrancar
    solenoid:     8   # Y10 octal → offset decimal 8 — electroválvula 1
    backlight:   10   # Y12 octal → offset decimal 10 — pantalla roja 1

scanner_2:
  camera_source: "http://192.168.1.2/oneshotimage.jpg"
  model: "modelo_B"
  allowed_models: ["modelo_A", "modelo_B"]   # Esterilla y Microperforado
  force_auto_mode: true   # TEMPORAL: forzar AUTO mientras X2 no llega al PLC
  inspection_models:
    modelo_A:
      # ESTERILLA scanner_2, calibrada con 501 frames OK del 31-07-2026.
      # Solo inspeccionar cuando cambia realmente la posicion de la chapa. La
      # secuencia de camara evita duplicar una captura retenida y este umbral
      # adicional filtra ruido/JPEG de capturas nuevas con la chapa quieta.
      continuous_position_threshold: 3.0
      # Mismas reglas temporales seguras que Microperforado scanner_2: ninguna
      # parada por faltantes/desalineacion puede disparar con un solo frame.
      consecutive_nok_frames: 9999
      machine_stop_missing_frames: 3
      pattern_align_stop_frames: 3
      pattern_align_severe_abs_max_px: 0.0
      stop_min_frames: 3
      # LOW_QUALITY aislado no decide. Una racha sostenida si corta: seguir
      # produciendo sin imagen confiable es un fallo de inspeccion, no un OK.
      low_quality_stop_frames: 16
      inspection_stall_warn_s: 3.0
      # La cinta puede demorar normalmente al iniciar despues de pulsar RUN.
      # Esperar 30s completos sin analisis antes de pasar a ERROR.
      inspection_stall_timeout_s: 30.0
      roi_recenter_enabled: false
      roi_precal_enabled: false
    modelo_B:
      # Overrides especificos para microperforado en scanner_2.
      # No afectan scanner_1; se mezclan arriba de tolerancias.yaml solo cuando
      # la inspeccion corre con scanner_id=scanner_2.
      # Ajuste fino del 16-06:
      # - pasar a gray + sin CLAHE separa mejor microagujeros vecinos;
      # - blur/open/close chicos limpian ruido sin volver a unir filas;
      # - bajar max_area corta blobs fusionados grandes en la zona baja;
      # - reducir chapa_edge_inner_px estabiliza la toma de borde de chapa.
      # Blindaje comun de scanner_2: nunca producir indefinidamente sin una
      # decision visual, y nunca parar por una unica evidencia geometrica.
      stop_min_frames: 3
      low_quality_stop_frames: 16
      inspection_stall_warn_s: 3.0
      # Mismo tiempo de arranque permitido para todo scanner_2.
      inspection_stall_timeout_s: 30.0
      threshold: 145
      use_channel: gray
      use_clahe: false
      blur_ksize: 3
      open_ksize: 3
      close_ksize: 2
      # ROI recenter en modo MOVE (Cambio 235): mantiene w=265 fijo (igual que
      # image_size del patron) y solo desplaza x, evitando el desync de Cambio 185
      # que causaba el modo resize al ir agrandando w.
      # No reacciona de golpe ante una desalineacion repentina: urgent_delta_px queda
      # tan alto que el atajo de 1-solo-frame nunca dispara (un salto brusco de todos
      # los frames es sintoma de un problema mecanico real, no algo que el ROI deba
      # "corregir" solo). Solo actua si la deriva se sostiene durante varios frames;
      # deriva gradual y persistente, no un salto puntual.
      roi_recenter_enabled: false   # FIJO: el ROI NO se auto-mueve ni se re-guarda; la posicion queda exactamente como se calibro (evita el corrimiento lateral al reiniciar)
      roi_recenter_mode: move
      # Seguir la deriva antes de que el recorte llegue a perder agujeros. El
      # baseline se aprende solo despues del movimiento real de RUN.
      roi_recenter_require_edge_missing: false
      # No precalibrar apenas se pulsa RUN: la cinta puede tardar un tiempo variable,
      # incluso mas de 20s, en moverse y esos frames quietos no son una referencia
      # valida. El recentrado gradual comienza cuando se detecta movimiento real.
      roi_precal_enabled: false
      roi_recenter_warmup_frames: 30
      roi_recenter_trigger_delta_px: 5.0
      roi_recenter_edge_missing_min: 2
      roi_recenter_edge_band_px: 30.0
      roi_recenter_streak_frames: 15
      roi_recenter_step_px: 1.0
      roi_recenter_max_total_shift_px: 20.0
      roi_recenter_urgent_delta_px: 1000.0
      roi_recenter_cooldown_frames: 15
      roi_recenter_cooldown_max_frames: 15
      roi_recenter_cooldown_mult: 1.0
      # Deteccion de desalineamiento geometrico: basada SOLO en metricas de
      # centering (zigzag de borde + inclinacion), SIN gate de missing.
      # Con min_missing=0 no se requieren agujeros faltantes para activar el
      # check; las metricas del patron solas determinan si hay desalineacion.
      # stop_frames=3: 3 frames consecutivos desalineados disparan machine_stop.
      pattern_align_enabled: true
      # min_missing=1: se exige al menos 1 faltante para entrar al check de zigzag.
      # Esto filtra frames de borde de chapa (std alto pero missing=0) sin impedir
      # la deteccion en frames realmente desalineados (que siempre tienen missing>=1).
      pattern_align_min_missing: 1
      pattern_align_std_max_px: 3.0
      pattern_align_abs_max_px: 10.0
      # Cambio 279 (23-07-2026): scanner_2 tambien exige como minimo 3 frames
      # consecutivos; un frame aislado nunca detiene la maquina.
      pattern_align_stop_frames: 3
      pattern_global_offset_max_px: 0.0
      # Calibracion 03-07-2026: el baseline bueno de scanner_2 en microperforado
      # ya vive cerca de 0.7-1.1deg de delta patron/chapa. Con 0.6deg se marcaban
      # falsos "PATRON DESALINEADO" y, por racha de 2 frames, FAULT instantaneo
      # aunque la pieza estuviera bien.
      # Recalibracion 14-07-2026 (Cambio 261): tras robustecer la deteccion del
      # borde de chapa en edge_centering (compuertas de lados sostenidos + cruce
      # de nivel medio), el ruido remanente del delta ya no es artefacto de
      # medicion sino ondulacion REAL del borde del fleje (slitting), medida en
      # <=1.4deg sobre el lote "Imagenes error NOK 14-7". 2.2deg deja margen
      # sobre ese ruido natural y sigue disparando ante inclinaciones reales
      # sostenidas del patron (>2.2deg durante stop_frames=3).
      pattern_slope_delta_max_deg: 2.2
      # Cambio 255 (07-07-2026): a pedido de Tadeo se desactiva la parada
      # instantanea de 1 solo frame por desalineacion severa (severe_abs_max_px=0.0).
      # Ahora toda desalineacion, por severa que sea, tiene que sostenerse
      # pattern_align_stop_frames=3 frames seguidos antes de parar la maquina.
      pattern_align_severe_abs_max_px: 0.0
      # ROI de scanner_2 es 205px ancho — el margen global de 50px dejaria solo
      # 2-3 columnas al construir el patron. Usar margen pequeño para capturar
      # todos los agujeros; los bordes se excluyen en comparacion via compare_*_ignore_px.
      pattern_edge_margin_px: 5.0
      # Geometria de la grilla: scanner_2 tiene optica diferente a scanner_1.
      # Stagger POSITIVO (+18) = filas impares desplazadas a la DERECHA (scanner_1 usa -18 = izquierda).
      grid_stagger_x_odd: 18.0
      grid_dx: 35.5
      grid_dy: 13.6
      # El fleje continuo puede entrar con cualquiera de las dos paridades de fila.
      # La seleccion usa un gate menor a media separacion vertical para que una fila
      # vecina no parezca valida (tol_xy_px=42 queda reservado al matching final).
      grid_allow_row_parity_flip: true
      grid_parity_selection_tol_px: 6.0
      # Matching mas permisivo solo para scanner_2 en microperforado; reduce
      # missing residuales del lote OK sin afectar scanner_1.
      tol_xy_px: 42.0
      # Calibracion 03-07-2026: en el lote NOK aportado aparecian falsos missing
      # aislados de 2-4 agujeros sobre piezas sanas. Con umbral 2 esos frames
      # pasaban a NOK aunque el patron estuviera bien. Subir a 5 mantiene margen
      # frente a defectos reales grandes (historicamente 6-9 missing en microperforado)
      # y evita castigar ruido chico de matching.
      # Hasta 3 near-miss aislados pueden aparecer por ondulacion/blur sin ser un
      # defecto. Desde 4 faltantes el frame es NOK; aun con 1 solo faltante, la
      # persistencia por columna sigue activa y detiene tras 3 frames consecutivos.
      frame_missing_nok_threshold: 3
      # ROI ampliado: mantener el patron amplio, pero excluir del matching la franja
      # derecha mas inestable para no penalizar el borde residual.
      pattern_edge_margin_right_px: 15.0
      compare_left_ignore_px: 45.0
      compare_right_ignore_px: 55.0
      # Con desalineamiento, los faltantes quedan repartidos (1 por columna ci).
      # min_missing=1 permite que cada columna acumule racha aunque falte un solo
      # agujero por frame; no se condiciona al gate global del frame.
      machine_stop_min_missing: 1
      machine_stop_require_frame_nok: false
      # Filtra blobs fusionados/reflejos: con gray quedan agujeros reales ~160-185px2
      # y los falsos unificados pasan claramente por arriba.
      max_area: 250.0
      # Calibracion 24-07-2026 sobre 499 frames OK reales con zoom digital:
      # 1200 marcaba los frames como LOW_QUALITY e impedia sumar OK/NOK.
      blur_score_min: 300.0
      # Ajuste fino de borde de patron: bajar el gate lateral evita que una banda
      # tome la columna siguiente como borde y dibuje zigzag falso en el overlay.
      pattern_edge_boundary_tol_px: 5.0
      chapa_edge_inner_px: 40
  inputs:
    mode_switch:  2   # X2  — maneta (0=MANUAL, 1=AUTO)
  outputs:
    light_red:    4   # Y4  — rojo
    light_green:  5   # Y5  — verde
    light_yellow: 6   # Y6  — amarillo
    light_blue:   7   # Y7  — azul
    solenoid:     9   # Y11 octal → offset decimal 9 — electroválvula 2
    backlight:   11   # Y13 octal → offset decimal 11 — pantalla roja 2
